services:
  postgres:
    image: postgres:16-alpine
    container_name: yasmin2-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yasmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib di .env root}
      POSTGRES_DB: ${DB_NAME:-yasmin}
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    networks:
      - yasmin2_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yasmin} -d ${DB_NAME:-yasmin}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yasmin2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-yasmin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-yasmin}?schema=yasmin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib di .env root}
      DEVICE_BOOTSTRAP_SECRET: ${DEVICE_BOOTSTRAP_SECRET:?DEVICE_BOOTSTRAP_SECRET wajib di .env root}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL wajib di .env root}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS wajib di .env root}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY wajib di .env root}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RS_YASMIN_PLACE_ID: ${RS_YASMIN_PLACE_ID:-}
      SIMRS_BASE_URL: ${SIMRS_BASE_URL:-}
      SIMRS_API_KEY: ${SIMRS_API_KEY:-}
    networks:
      - yasmin2_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: yasmin2-frontend
    restart: unless-stopped
    networks:
      - yasmin2_net
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=1777
      - /var/run:size=8m,mode=1777
      - /tmp:size=64m,mode=1777
      - /var/log/nginx:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: yasmin2-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - yasmin2_net

volumes:
  postgres_data2:

networks:
  yasmin2_net:
    driver: bridge